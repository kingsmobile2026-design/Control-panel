<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🔥 근성봇 제어 패널</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #1e1e2e; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #2a2a3c; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); width: 350px; }
        h2 { text-align: center; color: #ff5555; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #b2b2b2; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #444; background: #1e1e2e; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #ff5555; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #ff3333; }
        #status { margin-top: 15px; text-align: center; font-size: 13px; color: #50fa7b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔥 DM 근성 패널</h2>
        <label>대상 유저 고유 ID (User ID)</label>
        <input type="text" id="targetId" placeholder="예: 123456789012345678">

        <label>보낼 메시지</label>
        <textarea id="messageText" rows="3" placeholder="근성 심어줄 메시지 입력"></textarea>

        <label>전송 횟수</label>
        <input type="number" id="count" value="5" min="1" max="50">

        <button onclick="startSpam()">🚀 근성 폭격 시작</button>
        <div id="status"></div>
    </div>

    <script>
        async function startSpam() {
            const targetId = document.getElementById('targetId').value.trim();
            const messageText = document.getElementById('messageText').value.trim();
            const count = parseInt(document.getElementById('count').value);
            const statusDiv = document.getElementById('status');

            if (!targetId || !messageText) {
                alert('유저 ID와 메시지를 모두 입력해주세요!');
                return;
            }

            statusDiv.innerText = "⏳ 전송 요청 중...";

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ targetId, messageText, count })
                });

                const data = await response.json();
                if (response.ok) {
                    statusDiv.innerText = "✅ " + data.message;
                } else {
                    statusDiv.innerText = "❌ 에러: " + data.error;
                }
            } catch (err) {
                statusDiv.innerText = "❌ 서버 통신 실패!";
            }
        }
    </script>
</body>
</html>
